          cat << 'EOF' > app/src/main/java/ru/vesta/hudbridge/YandexAccessibilityService.java
          package ru.vesta.hudbridge;

          import android.accessibilityservice.AccessibilityService;
          import android.view.accessibility.AccessibilityEvent;
          import android.view.accessibility.AccessibilityNodeInfo;
          import android.view.accessibility.AccessibilityWindowInfo;
          import java.util.ArrayList;
          import java.util.List;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;

          public class YandexAccessibilityService extends AccessibilityService {
              private static final Pattern DIST_PAT = Pattern.compile("^(\\d+(?:[.,]\\d+)?)\\s*(м|км|m|km)$", Pattern.CASE_INSENSITIVE | Pattern.UNICODE_CASE);
              private static final Pattern INLINE_DIST = Pattern.compile("(\\d+(?:[.,]\\d+)?)\\s*(м|км|m|km)\\b", Pattern.CASE_INSENSITIVE | Pattern.UNICODE_CASE);

              @Override
              protected void onServiceConnected() {
                  super.onServiceConnected();
                  RootAutoEnabler.ensureServicesActive(this, false);
              }

              @Override
              public void onAccessibilityEvent(AccessibilityEvent event) {
                  RootAutoEnabler.ensureServicesActive(this, false);

                  List<String> nodes = new ArrayList<>();
                  String detectedTurn = "";

                  try {
                      List<AccessibilityWindowInfo> windows = getWindows();
                      if (windows != null && !windows.isEmpty()) {
                          for (AccessibilityWindowInfo win : windows) {
                              AccessibilityNodeInfo root = win.getRoot();
                              if (root != null) {
                                  String pkg = (root.getPackageName() != null) ? root.getPackageName().toString().toLowerCase() : "";
                                  if (pkg.contains("yandex") || pkg.contains("navi") || pkg.contains("systemui")) {
                                      String turn = collectNodes(root, nodes);
                                      if (detectedTurn.isEmpty() && !turn.isEmpty()) detectedTurn = turn;
                                  }
                                  root.recycle();
                              }
                          }
                      }
                  } catch (Throwable ignored) {}

                  if (nodes.isEmpty()) {
                      AccessibilityNodeInfo root = getRootInActiveWindow();
                      if (root != null) {
                          String pkg = (root.getPackageName() != null) ? root.getPackageName().toString().toLowerCase() : "";
                          if (pkg.contains("yandex") || pkg.contains("navi")) {
                              String turn = collectNodes(root, nodes);
                              if (detectedTurn.isEmpty() && !turn.isEmpty()) detectedTurn = turn;
                          }
                          root.recycle();
                      }
                  }

                  if (nodes.isEmpty()) return;

                  String distStr = "";
                  String streetStr = "";
                  int speedLim = 0;

                  for (int i = 0; i < nodes.size(); i++) {
                      String s = nodes.get(i).trim();
                      if (s.isEmpty()) continue;

                      if (s.matches("^(20|30|40|50|60|70|80|90|100|110|120|130)$")) {
                          speedLim = Integer.parseInt(s);
                          continue;
                      }

                      String tWord = YandexNotificationService.extractTurnWordFromText(s);
                      if (!tWord.isEmpty() && detectedTurn.isEmpty()) {
                          detectedTurn = tWord;
                      }

                      Matcher mExact = DIST_PAT.matcher(s);
                      if (mExact.matches() && distStr.isEmpty()) {
                          distStr = mExact.group(1).replace(',', '.') + " " + mExact.group(2).toLowerCase();
                          if (i + 1 < nodes.size()) {
                              String next = nodes.get(i + 1).trim();
                              if (next.length() >= 2 && !next.matches(".*\\d+\\s*(мин|ч).*")) {
                                  streetStr = next;
                              }
                          }
                          continue;
                      }

                      Matcher mIn = INLINE_DIST.matcher(s);
                      if (mIn.find() && distStr.isEmpty()) {
                          distStr = mIn.group(1).replace(',', '.') + " " + mIn.group(2).toLowerCase();
                          String tail = s.substring(mIn.end()).trim();
                          if (tail.length() >= 2 && streetStr.isEmpty()) {
                              streetStr = tail;
                          }
                      }
                  }

                  if (!detectedTurn.isEmpty()) {
                      UsbSerialManager.rememberTurn(detectedTurn);
                  } else {
                      detectedTurn = UsbSerialManager.getRememberedTurn();
                  }

                  if (!distStr.isEmpty()) {
                      StringBuilder sb = new StringBuilder(distStr);
                      if (!detectedTurn.isEmpty()) sb.append(" ").append(detectedTurn);
                      if (!streetStr.isEmpty() && !streetStr.equalsIgnoreCase(detectedTurn)) {
                          sb.append(" ").append(streetStr);
                      }
                      UsbSerialManager.getInstance().sendYandexPayload(this, sb.toString());
                  }

                  if (speedLim > 0) {
                      UsbSerialManager.getInstance().sendYandexPayload(this, "0 Ограничение " + speedLim);
                  }
              }

              private String collectNodes(AccessibilityNodeInfo node, List<String> out) {
                  if (node == null) return "";
                  String foundTurn = "";

                  if (node.getViewIdResourceName() != null) {
                      String idName = node.getViewIdResourceName();
                      String t = ArrowBitmapClassifier.classifyResourceName(idName);
                      if (!t.isEmpty()) foundTurn = t;
                  }

                  if (node.getContentDescription() != null) {
                      String cd = node.getContentDescription().toString().trim();
                      if (!cd.isEmpty()) {
                          out.add(cd);
                          String t = YandexNotificationService.extractTurnWordFromText(cd);
                          if (t.isEmpty()) t = ArrowBitmapClassifier.classifyResourceName(cd);
                          if (!t.isEmpty() && foundTurn.isEmpty()) foundTurn = t;
                      }
                  }

                  if (node.getText() != null) {
                      String txt = node.getText().toString().trim();
                      if (!txt.isEmpty()) out.add(txt);
                  }

                  for (int i = 0; i < node.getChildCount(); i++) {
                      AccessibilityNodeInfo ch = node.getChild(i);
                      if (ch != null) {
                          String childTurn = collectNodes(ch, out);
                          if (foundTurn.isEmpty() && !childTurn.isEmpty()) foundTurn = childTurn;
                          ch.recycle();
                      }
                  }
                  return foundTurn;
              }

              @Override
              public void onInterrupt() {}
          }
