                cachedSpeedLimitMs = System.currentTimeMillis();
              }
              int sendLim = (limit >= 20 && limit <= 130) ? limit : cachedSpeedLimit;
              String body = (distM > 0)
                  ? (distM + " м Камера " + (sendLim > 0 ? sendLim : 0))
                  : ("200 м Камера " + (sendLim > 0 ? sendLim : 0));
              sendYandexPayload(ctx, body, srcTag);
            }
            public synchronized void tickKeepSpeedLimitAlive(Context ctx, long now) {
