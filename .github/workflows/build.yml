          # 8. MainActivity.java — Панель управления v4.2 + кнопка CLR
          # ------------------------------------------------------------------
          cat << 'EOF' > app/src/main/java/ru/vesta/hudbridge/MainActivity.java
          package ru.vesta.hudbridge;
          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          public class MainActivity extends Activity {
            private TextView statusView;
            private TextView logView;
            private final Handler handler = new Handler(Looper.getMainLooper());
            @Override
            protected void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              RootAutoEnabler.ensureServicesActive(this, true);
              UsbSerialManager.getInstance().ensureConnected(this);
              ScrollView scroll = new ScrollView(this);
              scroll.setBackgroundColor(Color.parseColor("#080C14"));
              LinearLayout root = new LinearLayout(this);
              root.setOrientation(LinearLayout.VERTICAL);
              root.setPadding(32, 26, 32, 26);
              TextView title = new TextView(this);
              title.setText("Vesta HUD Bridge v4.2 CITY-FAST (300ms + ROOT)");
              title.setTextColor(Color.parseColor("#00E67D"));
              title.setTextSize(21f);
              root.addView(title);
              TextView sub = new TextView(this);
              sub.setText("Опрос 300 мс • Авто-сброс CLR через 3.5с • Жесткий анти-сон Teyes (WakeLock + Root Watchdog)");
              sub.setTextColor(Color.parseColor("#94A3B8"));
              sub.setTextSize(12.5f);
              sub.setPadding(0, 6, 0, 16);
              root.addView(sub);
              statusView = new TextView(this);
              statusView.setBackgroundColor(Color.parseColor("#111927"));
              statusView.setTextColor(Color.WHITE);
              statusView.setTextSize(14.5f);
              statusView.setPadding(22, 16, 22, 16);
              root.addView(statusView);
              TextView logHdr = new TextView(this);
              logHdr.setText("Живой лог перехвата ([BITMAP] / [RES_ID] / [TEXT] / [SCREEN] / [AUTO]):");
              logHdr.setTextColor(Color.parseColor("#00E5FF"));
              logHdr.setTextSize(12.5f);
              logHdr.setPadding(0, 14, 0, 6);
              root.addView(logHdr);
              logView = new TextView(this);
              logView.setBackgroundColor(Color.parseColor("#05080F"));
              logView.setTextColor(Color.parseColor("#00E67D"));
              logView.setTypeface(Typeface.MONOSPACE);
              logView.setTextSize(12.5f);
              logView.setPadding(18, 14, 18, 14);
              root.addView(logView);
              addBtn(root, "⚡ 1. Активировать всё и отключить сон через ROOT (su)", "#00C853", v -> {
                RootAutoEnabler.ensureServicesActive(this, true);
                UsbSerialManager.getInstance().ensureConnected(this);
              });
              addBtn(root, "🔔 2. Доступ к уведомлениям (ручная проверка)", "#1E293B", v -> {
                startActivity(new Intent("android.settings.ACTION_NOTIFICATION_LISTENER_SETTINGS"));
              });
              addBtn(root, "👁 3. Спец. возможности (ручная проверка)", "#1E293B", v -> {
                startActivity(new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS));
              });
              addBtn(root, "⬅️ Тест по USB: 120 м Налево ул. Марджани + Знак 60", "#0284C7", v -> {
                UsbSerialManager.rememberTurn("Налево");
                UsbSerialManager.getInstance().sendYandexPayload(this, "120 м Налево ул. Марджани", "TEST");
                UsbSerialManager.getInstance().sendYandexPayload(this, "0 Ограничение 60", "TEST");
              });
              addBtn(root, "🧹 Очистить экран HUD (Отправить CLR)", "#991B1B", v -> {
                UsbSerialManager.getInstance().sendYandexPayload(this, "CLR", "TEST");
              });
              scroll.addView(root);
              setContentView(scroll);
              handler.post(updateLoop);
            }
            private void addBtn(LinearLayout parent, String text, String bgHex, android.view.View.OnClickListener l) {
              Button b = new Button(this);
              b.setText(text);
              b.setAllCaps(false);
              b.setTextColor(Color.WHITE);
              b.setTextSize(14.5f);
              b.setBackgroundColor(Color.parseColor(bgHex));
              LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(
                  LinearLayout.LayoutParams.MATCH_PARENT,
                  LinearLayout.LayoutParams.WRAP_CONTENT
              );
              lp.setMargins(0, 12, 0, 0);
              b.setLayoutParams(lp);
              b.setGravity(Gravity.CENTER);
              b.setOnClickListener(l);
              parent.addView(b);
            }
            private final Runnable updateLoop = new Runnable() {
              @Override
              public void run() {
                try {
                  String acc = Settings.Secure.getString(getContentResolver(), Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES);
                  String not = Settings.Secure.getString(getContentResolver(), "enabled_notification_listeners");
                  boolean accOk = (acc != null && acc.contains("ru.vesta.hudbridge"));
                  boolean notOk = (not != null && not.contains("ru.vesta.hudbridge"));
                  String info = "Статус служб на Teyes CC3:\n"
                      + "• Чтение экрана (Accessibility): " + (accOk ? "✅ ВКЛЮЧЕНА" : "❌ ВЫКЛ (нажми кнопку 1)") + "\n"
                      + "• Перехват шторки (Notifications): " + (notOk ? "✅ ВКЛЮЧЕНА" : "❌ ВЫКЛ (нажми кнопку 1)") + "\n"
                      + "• Анти-выгрузка (KeepAlive 300мс + WakeLock): " + (HudKeepAliveService.isRunning() ? "✅ РАБОТАЕТ" : "⏳ ЗАПУСК") + "\n"
                      + "• ROOT Watchdog (15с): " + (RootAutoEnabler.isRootActive() ? "✅ АКТИВЕН" : "⏳ Ожидает ROOT") + "\n"
                      + "• Память стрелки (12с): " + (UsbSerialManager.getRememberedTurn().isEmpty() ? "нет" : UsbSerialManager.getRememberedTurn()) + "\n"
                      + "• USB ESP32-S3: " + UsbSerialManager.getInstance().getLastStatus();
                  statusView.setText(info);
                  logView.setText(UsbSerialManager.getInstance().getDebugLog());
                } catch (Throwable ignored) {}
                handler.postDelayed(this, 600);
              }
            };
            @Override
            protected void onDestroy() {
              super.onDestroy();
              handler.removeCallbacksAndMessages(null);
            }
          }
