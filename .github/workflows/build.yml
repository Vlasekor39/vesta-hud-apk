          package ru.vesta.hudbridge;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.hardware.usb.UsbManager;
          public class BootReceiver extends BroadcastReceiver {
            @Override
            public void onReceive(Context context, Intent intent) {
              String act = (intent != null && intent.getAction() != null) ? intent.getAction() : "";
              if (UsbManager.ACTION_USB_DEVICE_DETACHED.equals(act)) {
                UsbSerialManager.getInstance().disconnect();
                return;
              }
              RootAutoEnabler.ensureServicesActive(context, false);
              UsbSerialManager.getInstance().ensureConnected(context);
            }
          }
