          # ------------------------------------------------------------------
          cat << 'EOF' > app/src/main/java/ru/vesta/hudbridge/UsbSerialManager.java
          package ru.vesta.hudbridge;
          import android.app.PendingIntent;
          import android.content.Context;
          import android.content.Intent;
          import android.hardware.usb.UsbConstants;
          import android.hardware.usb.UsbDevice;
          import android.hardware.usb.UsbDeviceConnection;
          import android.hardware.usb.UsbEndpoint;
          import android.hardware.usb.UsbInterface;
          import android.hardware.usb.UsbManager;
          import android.os.Build;
          import java.nio.charset.StandardCharsets;
          import java.text.SimpleDateFormat;
          import java.util.Date;
          import java.util.HashMap;
          import java.util.LinkedList;
          import java.util.Locale;
          public class UsbSerialManager {
            private static UsbSerialManager instance;
            private UsbDeviceConnection connection;
            private UsbEndpoint epOut;
            private int connectedVid = 0;
            private int connectedPid = 0;
            private String lastNavPacket = "";
            private long lastNavSendTime = 0;
            private String lastSignPacket = "";
            private long lastSignSendTime = 0;
            private long lastPermReqMs = 0;
            private String lastStatus = "Ожидание USB ESP32-S3...";
            private static volatile String activeTurnMemory = "";
            private static volatile long activeTurnTime = 0;
            private static volatile int lastDistMeters = -1;
            private static volatile long lastRouteSeenMs = 0;
            private static volatile boolean routeActiveSent = false;
            private static volatile long lastForegroundYandexMs = 0;
            private final LinkedList<String> debugLines = new LinkedList<>();
            public static synchronized UsbSerialManager getInstance() {
              if (instance == null) instance = new UsbSerialManager();
              return instance;
            }
            public synchronized boolean isConnected() {
              return (connection != null && epOut != null);
            }
            public synchronized void addLog(String msg) {
              String ts = new SimpleDateFormat("HH:mm:ss", Locale.US).format(new Date());
              debugLines.addFirst(ts + " " + msg);
              while (debugLines.size() > 10) debugLines.removeLast();
            }
            public synchronized String getDebugLog() {
              if (debugLines.isEmpty()) return "Ожидание событий от Яндекс.Навигатора...";
              StringBuilder sb = new StringBuilder();
              for (String line : debugLines) {
                sb.append(line).append("\n");
              }
              return sb.toString().trim();
            }
            public String getLastStatus() {
              return lastStatus;
            }
            public static void markYandexForeground() {
              lastForegroundYandexMs = System.currentTimeMillis();
            }
            public static boolean isYandexRecentlyForeground() {
              return (System.currentTimeMillis() - lastForegroundYandexMs) < 3500;
            }
            public static void markRouteSeen(int distMeters) {
              long now = System.currentTimeMillis();
              if (distMeters > 0 && lastDistMeters > 0 && distMeters > lastDistMeters + 60) {
                activeTurnMemory = "";
                activeTurnTime = 0;
              }
              if (distMeters > 0) {
                lastDistMeters = distMeters;
              }
              lastRouteSeenMs = now;
              routeActiveSent = true;
            }
            public static boolean shouldSendAutoClear(long now) {
              return routeActiveSent && lastRouteSeenMs > 0 && (now - lastRouteSeenMs >= 3500);
            }
            public static void clearTurnMemory() {
              activeTurnMemory = "";
              activeTurnTime = 0;
              lastDistMeters = -1;
              routeActiveSent = false;
            }
            public static void rememberTurn(String turnWord) {
              if (turnWord == null || turnWord.isEmpty()) return;
              activeTurnMemory = turnWord;
              activeTurnTime = System.currentTimeMillis();
            }
            public static String getRememberedTurn() {
              if (System.currentTimeMillis() - activeTurnTime < 12000) {
                return activeTurnMemory;
              }
              return "";
            }
            public static int parseMetersFromDistStr(String distPart) {
              if (distPart == null || distPart.isEmpty()) return -1;
              try {
                String low = distPart.toLowerCase(Locale.ROOT).trim();
                String num = low.replaceAll("[^0-9.,]", "").replace(',', '.');
                if (num.isEmpty()) return -1;
                float val = Float.parseFloat(num);
                if (low.contains("км") || low.contains("km")) {
                  return Math.round(val * 1000.0f);
                }
                return Math.round(val);
              } catch (Throwable ignored) {
                return -1;
              }
            }
            public static boolean isAllowedEspSerialDevice(UsbDevice dev) {
              if (dev == null) return false;
              int vid = dev.getVendorId();
              return (vid == 0x303A || vid == 0x10C4 || vid == 0x1A86 || vid == 0x0403);
            }
            public synchronized void disconnect() {
              closeConnection();
              lastStatus = "USB отключен (ожидание переподключения)";
              addLog("[USB] Устройство отключено");
            }
            public synchronized void sendYandexPayload(Context ctx, String rawBody, String srcTag) {
              if (rawBody == null) return;
              String clean = rawBody.trim().replace(";", "").replace("\r", " ").replace("\n", " ");
              while (clean.contains("  ")) clean = clean.replace("  ", " ");
              if (clean.length() < 2) return;
              boolean isClear = "CLR".equalsIgnoreCase(clean);
              if (isClear) {
                clearTurnMemory();
              }
              String low = clean.toLowerCase();
              if (!isClear && (low.contains("уведомлять") || low.contains("превышен") || low.contains("нештраф")
                  || low.contains("/ч") || low.contains("+20") || low.contains("+15")
                  || low.contains("скачивает") || low.contains("поиск спут"))) {
                return;
              }
              boolean isSign = clean.startsWith("0 Ограничение");
              String packet = "$Y," + clean + ";\n";
              long now = System.currentTimeMillis();
              if (isSign) {
                if (packet.equals(lastSignPacket) && (now - lastSignSendTime < 2500)) return;
              } else if (isClear) {
                if (packet.equals(lastNavPacket) && (now - lastNavSendTime < 2000)) return;
              } else {
                if (packet.equals(lastNavPacket) && (now - lastNavSendTime < 800)) return;
              }
              addLog("[" + srcTag + "] " + clean);
              if (!ensureConnected(ctx)) {
                lastStatus = "ESP32 не найдена по USB (проверь кабель)";
                return;
              }
              try {
                byte[] bytes = packet.getBytes(StandardCharsets.UTF_8);
                int res = connection.bulkTransfer(epOut, bytes, bytes.length, 250);
                if (res >= 0) {
                  if (isSign) {
                    lastSignPacket = packet;
                    lastSignSendTime = now;
                  } else {
                    lastNavPacket = packet;
                    lastNavSendTime = now;
                    if (isClear) {
                      lastSignPacket = "";
                      lastSignSendTime = 0;
                    }
                  }
                  lastStatus = String.format(Locale.US, "USB OK (%04X:%04X) • %s", connectedVid, connectedPid, clean);
                } else {
                  closeConnection();
                  lastStatus = "Переподключение USB...";
                }
              } catch (Throwable t) {
                closeConnection();
                lastStatus = "Ошибка USB: " + t.getMessage();
              }
            }
            public synchronized boolean ensureConnected(Context ctx) {
              if (connection != null && epOut != null) return true;
              try {
                UsbManager manager = (UsbManager) ctx.getSystemService(Context.USB_SERVICE);
                if (manager == null) return false;
                HashMap<String, UsbDevice> list = manager.getDeviceList();
                if (list == null || list.isEmpty()) return false;
                for (UsbDevice dev : list.values()) {
                  if (!isAllowedEspSerialDevice(dev)) continue;
                  if (!manager.hasPermission(dev)) {
                    long now = System.currentTimeMillis();
                    if (now - lastPermReqMs > 5000) {
                      lastPermReqMs = now;
                      Intent piIntent = new Intent("ru.vesta.hudbridge.USB_PERMISSION");
                      piIntent.setPackage(ctx.getPackageName());
                      int flags = (Build.VERSION.SDK_INT >= 31)
                          ? (PendingIntent.FLAG_MUTABLE | PendingIntent.FLAG_UPDATE_CURRENT)
                          : PendingIntent.FLAG_UPDATE_CURRENT;
                      PendingIntent pi = PendingIntent.getBroadcast(ctx, 0, piIntent, flags);
                      manager.requestPermission(dev, pi);
                      lastStatus = "Запрос USB-разрешения для ESP32...";
                    }
                    continue;
                  }
                  if (openDevice(manager, dev)) {
                    return true;
                  }
                }
              } catch (Throwable ignored) {}
              return false;
            }
            private boolean openDevice(UsbManager manager, UsbDevice dev) {
              UsbDeviceConnection conn = manager.openDevice(dev);
              if (conn == null) return false;
              UsbEndpoint foundOut = null;
              for (int i = 0; i < dev.getInterfaceCount(); i++) {
                UsbInterface intf = dev.getInterface(i);
                conn.claimInterface(intf, true);
                for (int j = 0; j < intf.getEndpointCount(); j++) {
                  UsbEndpoint ep = intf.getEndpoint(j);
                  if (ep.getType() == UsbConstants.USB_ENDPOINT_XFER_BULK
                      && ep.getDirection() == UsbConstants.USB_DIR_OUT) {
                    foundOut = ep;
                  }
                }
              }
              if (foundOut != null) {
                this.connection = conn;
                this.epOut = foundOut;
                this.connectedVid = dev.getVendorId();
                this.connectedPid = dev.getProductId();
                initSerialChip(conn, connectedVid, connectedPid);
                lastStatus = String.format(Locale.US, "USB подключен (%04X:%04X)", connectedVid, connectedPid);
                addLog("[USB] Подключено " + String.format(Locale.US, "%04X:%04X", connectedVid, connectedPid));
                return true;
              }
              conn.close();
              return false;
            }
            private void initSerialChip(UsbDeviceConnection conn, int vid, int pid) {
              try {
                byte[] lineCoding = new byte[]{
                    (byte) 0x00, (byte) 0xC2, (byte) 0x01, (byte) 0x00,
                    (byte) 0x00, (byte) 0x00, (byte) 0x08
                };
                conn.controlTransfer(0x21, 0x20, 0, 0, lineCoding, lineCoding.length, 100);
                conn.controlTransfer(0x21, 0x22, 0x03, 0, null, 0, 100);
                if (vid == 0x10C4) {
                  conn.controlTransfer(0x41, 0x00, 0x0001, 0, null, 0, 100);
                  conn.controlTransfer(0x41, 0x03, 0x0800, 0, null, 0, 100);
                  conn.controlTransfer(0x41, 0x07, 0x0303, 0, null, 0, 100);
                  conn.controlTransfer(0x41, 0x1E, 0, 0, new byte[]{0x00, (byte) 0xC2, 0x01, 0x00}, 4, 100);
                } else if (vid == 0x1A86 && pid != 0x55D3 && pid != 0x55D4) {
                  conn.controlTransfer(0x40, 0xA1, 0, 0, null, 0, 100);
                  conn.controlTransfer(0x40, 0x9A, 0x1312, 0xCC03, null, 0, 100);
                  conn.controlTransfer(0x40, 0x9A, 0x0F2C, 0x0008, null, 0, 100);
                  conn.controlTransfer(0x40, 0x9A, 0x2518, 0x00C3, null, 0, 100);
                  conn.controlTransfer(0x40, 0xA4, 0xFF9F, 0, null, 0, 100);
                } else if (vid == 0x0403) {
                  conn.controlTransfer(0x40, 0x00, 0x0000, 0, null, 0, 100);
                  conn.controlTransfer(0x40, 0x03, 0x001A, 0, null, 0, 100);
                  conn.controlTransfer(0x40, 0x04, 0x0008, 0, null, 0, 100);
                  conn.controlTransfer(0x40, 0x01, 0x0303, 0, null, 0, 100);
                }
              } catch (Throwable ignored) {}
            }
            private void closeConnection() {
              try {
                if (connection != null) connection.close();
              } catch (Throwable ignored) {}
              connection = null;
              epOut = null;
              connectedVid = 0;
              connectedPid = 0;
            }
          }
