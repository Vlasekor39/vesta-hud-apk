name: Build VestaHudBridge v4.4 REAL-LANES APK

on:
  push:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: 4. Generate Android Project Files (VestaHudBridge v4.4 REAL-LANES)
        run: |
          mkdir -p app/src/main/java/ru/vesta/hudbridge
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values

          cat << 'EOF' > settings.gradle
          rootProject.name = "VestaHudBridge"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          buildscript {
            repositories {
              google()
              mavenCentral()
            }
            dependencies {
              classpath 'com.android.tools.build:gradle:8.1.4'
            }
          }
          allprojects {
            repositories {
              google()
              mavenCentral()
            }
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
            id 'com.android.application'
          }
          android {
            namespace 'ru.vesta.hudbridge'
            compileSdk 34
            defaultConfig {
              applicationId "ru.vesta.hudbridge"
              minSdk 24
              targetSdk 33
              versionCode 44
              versionName "4.4-REAL-LANES"
            }
            buildTypes {
              debug {
                minifyEnabled false
              }
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
          }
          dependencies {
          }
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
            <string name="app_name">Vesta HUD Bridge v4.4</string>
            <string name="acc_desc">Перехват реальных полос движения, маневров, камер и знаков Яндекс.Навигатора для проектора Lada Vesta HUD</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/xml/accessibility_service_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
            android:accessibilityEventTypes="typeWindowContentChanged|typeWindowStateChanged|typeNotificationStateChanged"
            android:accessibilityFeedbackType="feedbackGeneric"
            android:accessibilityFlags="flagDefault|flagRetrieveInteractiveWindows|flagReportViewIds|flagIncludeNotImportantViews"
            android:canRetrieveWindowContent="true"
            android:description="@string/acc_desc"
            android:notificationTimeout="80" />
          EOF

          cat << 'EOF' > app/src/main/res/xml/usb_device_filter.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
            <usb-device vendor-id="12346" />
            <usb-device vendor-id="6790" />
            <usb-device vendor-id="4292" />
            <usb-device vendor-id="1027" />
          </resources>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-feature android:name="android.hardware.usb.host" android:required="false" />
            <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
            <uses-permission android:name="android.permission.WAKE_LOCK" />
            <uses-permission android:name="android.permission.WRITE_SECURE_SETTINGS" />
            <application
              android:allowBackup="true"
              android:label="@string/app_name"
              android:persistent="true">
              <activity
                android:name=".MainActivity"
                android:exported="true"
                android:launchMode="singleTop">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
              </activity>
              <activity
                android:name=".UsbAttachActivity"
                android:exported="true"
                android:theme="@android:style/Theme.NoDisplay"
                android:excludeFromRecents="true"
                android:noHistory="true">
                <intent-filter>
                  <action android:name="android.hardware.usb.action.USB_DEVICE_ATTACHED" />
                </intent-filter>
                <meta-data
                  android:name="android.hardware.usb.action.USB_DEVICE_ATTACHED"
                  android:resource="@xml/usb_device_filter" />
              </activity>
              <service
                android:name=".HudKeepAliveService"
                android:exported="false" />
              <service
                android:name=".YandexNotificationService"
                android:label="Vesta HUD Уведомления Яндекса"
                android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE"
                android:exported="true">
                <intent-filter>
                  <action android:name="android.service.notification.NotificationListenerService" />
                </intent-filter>
              </service>
              <service
                android:name=".YandexAccessibilityService"
                android:label="Vesta HUD Чтение экрана Яндекса"
                android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                android:exported="true">
                <intent-filter>
                  <action android:name="android.accessibilityservice.AccessibilityService" />
                </intent-filter>
                <meta-data
                  android:name="android.accessibilityservice"
                  android:resource="@xml/accessibility_service_config" />
              </service>
              <receiver
                android:name=".BootReceiver"
                android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.BOOT_COMPLETED" />
                  <action android:name="android.intent.action.QUICKBOOT_POWERON" />
                  <action android:name="android.intent.action.USER_PRESENT" />
                  <action android:name="android.hardware.usb.action.USB_DEVICE_ATTACHED" />
                  <action android:name="android.hardware.usb.action.USB_DEVICE_DETACHED" />
                  <action android:name="ru.vesta.hudbridge.USB_PERMISSION" />
                </intent-filter>
              </receiver>
            </application>
          </manifest>
          EOF

          # ------------------------------------------------------------------
          # 1. HudKeepAliveService.java — Цикл 300 мс + WakeLock + Тихий Watchdog
          # ------------------------------------------------------------------
          cat << 'EOF' > app/src/main/java/ru/vesta/hudbridge/HudKeepAliveService.java
          package ru.vesta.hudbridge;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.os.Build;
          import android.os.IBinder;
          import android.os.PowerManager;
          import java.util.concurrent.Executors;
          import java.util.concurrent.ScheduledExecutorService;
          import java.util.concurrent.TimeUnit;
          public class HudKeepAliveService extends Service {
            private static final String CH_ID = "vesta_hud_keepalive_v44";
            private static volatile boolean running = false;
            private ScheduledExecutorService scheduler;
            private PowerManager.WakeLock wakeLock;
            private long lastUsbRetryMs = 0;
            private long lastWatchdogMs = 0;
            public static boolean isRunning() { return running; }
            public static void ensureStarted(Context ctx) {
              if (running || ctx == null) return;
              try {
                Intent i = new Intent(ctx, HudKeepAliveService.class);
                if (Build.VERSION.SDK_INT >= 26) ctx.startForegroundService(i);
                else ctx.startService(i);
              } catch (Throwable ignored) {}
            }
            @Override
            public void onCreate() {
              super.onCreate();
              running = true;
              try {
                PowerManager pm = (PowerManager) getSystemService(POWER_SERVICE);
                if (pm != null) {
                  wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "VestaHudBridge::KeepAliveLock");
                  wakeLock.acquire();
                }
              } catch (Throwable ignored) {}
              try {
                NotificationManager nm = (NotificationManager) getSystemService(NOTIFICATION_SERVICE);
                Notification.Builder b;
                if (Build.VERSION.SDK_INT >= 26) {
                  NotificationChannel ch = new NotificationChannel(CH_ID, "Vesta HUD USB Мост v4.4", NotificationManager.IMPORTANCE_LOW);
                  ch.setShowBadge(false);
                  ch.setSound(null, null);
                  if (nm != null) nm.createNotificationChannel(ch);
                  b = new Notification.Builder(this, CH_ID);
                } else {
                  b = new Notification.Builder(this);
                }
                Notification notif = b
                    .setContentTitle("Vesta HUD USB Мост v4.4 активен")
                    .setContentText("Реальные полосы Яндекса • 300 мс • Без спама Superuser")
                    .setSmallIcon(android.R.drawable.ic_menu_compass)
                    .setOngoing(true)
                    .build();
                startForeground(1017, notif);
              } catch (Throwable ignored) {}
              scheduler = Executors.newSingleThreadScheduledExecutor();
              scheduler.scheduleAtFixedRate(this::fastCityTick, 250, 300, TimeUnit.MILLISECONDS);
            }
            private void fastCityTick() {
              try {
                long now = System.currentTimeMillis();
                UsbSerialManager usb = UsbSerialManager.getInstance();
                if (!usb.isConnected() && (now - lastUsbRetryMs >= 2000)) {
                  lastUsbRetryMs = now;
                  usb.ensureConnected(this);
                }
                YandexAccessibilityService.pollScreenNow();
                YandexNotificationService.pollActiveNow();
                usb.tickKeepSpeedLimitAlive(this, now);
                if (UsbSerialManager.shouldSendAutoClear(now)) {
                  UsbSerialManager.clearTurnMemory();
                  usb.sendYandexPayload(this, "CLR", "AUTO");
                }
                if (now - lastWatchdogMs >= 20000) {
                  lastWatchdogMs = now;
                  RootAutoEnabler.runSilentWatchdog(this);
                }
              } catch (Throwable ignored) {}
            }
            @Override
            public int onStartCommand(Intent intent, int flags, int startId) {
              running = true;
              UsbSerialManager.getInstance().ensureConnected(this);
              return START_STICKY;
            }
            @Override
            public void onDestroy() {
              running = false;
              if (scheduler != null) { try { scheduler.shutdownNow(); } catch (Throwable ignored) {} }
              if (wakeLock != null && wakeLock.isHeld()) { try { wakeLock.release(); } catch (Throwable ignored) {} }
              super.onDestroy();
            }
            @Override
            public IBinder onBind(Intent intent) { return null; }
          }
          EOF

          # ------------------------------------------------------------------
          # 2. RootAutoEnabler.java — Однократный ROOT (su), далее тихо без тостов!
          # ------------------------------------------------------------------
          cat << 'EOF' > app/src/main/java/ru/vesta/hudbridge/RootAutoEnabler.java
          package ru.vesta.hudbridge;
          import android.content.ContentResolver;
          import android.content.Context;
          import android.provider.Settings;
          import java.io.DataOutputStream;
          import java.util.concurrent.TimeUnit;
          public class RootAutoEnabler {
            private static final String PKG = "ru.vesta.hudbridge";
            private static final String ACC_SVC = PKG + "/ru.vesta.hudbridge.YandexAccessibilityService";
            private static final String NOTIF_SVC = PKG + "/ru.vesta.hudbridge.YandexNotificationService";
            private static volatile boolean rootRanOnce = false;
            private static volatile boolean rootActiveOk = false;
            private static volatile long lastCheckMs = 0;
            public static boolean isRootActive() { return rootActiveOk; }
            public static void ensureServicesActive(Context ctx, boolean forceRoot) {
              HudKeepAliveService.ensureStarted(ctx);
              long now = System.currentTimeMillis();
              if (!forceRoot && (now - lastCheckMs < 8000)) return;
              lastCheckMs = now;
              boolean fixedSilently = trySilentSettingsRepair(ctx);
              if (forceRoot) {
                rootRanOnce = true;
                new Thread(() -> runRootCommandsOnce(ctx)).start();
              } else if (!fixedSilently && !rootRanOnce) {
                rootRanOnce = true;
                new Thread(() -> runRootCommandsOnce(ctx)).start();
              }
            }
            public static void runSilentWatchdog(Context ctx) {
              try {
                boolean ok = trySilentSettingsRepair(ctx);
                if (!ok && !rootRanOnce) {
                  rootRanOnce = true;
                  runRootCommandsOnce(ctx);
                }
              } catch (Throwable ignored) {}
            }
            private static boolean trySilentSettingsRepair(Context ctx) {
              try {
                ContentResolver cr = ctx.getContentResolver();
                String curAcc = Settings.Secure.getString(cr, Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES);
                String curNotif = Settings.Secure.getString(cr, "enabled_notification_listeners");
                boolean accMissing = (curAcc == null || !curAcc.contains(PKG));
                boolean notifMissing = (curNotif == null || !curNotif.contains(PKG));
                if (!accMissing && !notifMissing) return true;
                if (accMissing) {
                  String newAcc = (curAcc == null || curAcc.trim().isEmpty()) ? ACC_SVC : (curAcc + ":" + ACC_SVC);
                  Settings.Secure.putString(cr, Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES, newAcc);
                  Settings.Secure.putInt(cr, Settings.Secure.ACCESSIBILITY_ENABLED, 1);
                }
                if (notifMissing) {
                  String newNotif = (curNotif == null || curNotif.trim().isEmpty()) ? NOTIF_SVC : (curNotif + ":" + NOTIF_SVC);
                  Settings.Secure.putString(cr, "enabled_notification_listeners", newNotif);
                }
                return true;
              } catch (Throwable ignored) {
                return false;
              }
            }
            private static void runRootCommandsOnce(Context ctx) {
              Process p = null;
              try {
                ContentResolver cr = ctx.getContentResolver();
                String curAcc = Settings.Secure.getString(cr, Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES);
                String curNotif = Settings.Secure.getString(cr, "enabled_notification_listeners");
                String newAcc = (curAcc == null || curAcc.trim().isEmpty())
                    ? ACC_SVC : (curAcc.contains(PKG) ? curAcc : (curAcc + ":" + ACC_SVC));
                String newNotif = (curNotif == null || curNotif.trim().isEmpty())
                    ? NOTIF_SVC : (curNotif.contains(PKG) ? curNotif : (curNotif + ":" + NOTIF_SVC));
                p = Runtime.getRuntime().exec("su");
                DataOutputStream os = new DataOutputStream(p.getOutputStream());
                os.writeBytes("pm grant " + PKG + " android.permission.WRITE_SECURE_SETTINGS\n");
                os.writeBytes("dumpsys deviceidle whitelist +" + PKG + "\n");
                os.writeBytes("cmd appops set " + PKG + " RUN_IN_BACKGROUND allow\n");
                os.writeBytes("cmd appops set " + PKG + " RUN_ANY_IN_BACKGROUND allow\n");
                os.writeBytes("cmd appops set " + PKG + " WAKE_LOCK allow\n");
                os.writeBytes("am set-inactive " + PKG + " false\n");
                os.writeBytes("am set-standby-bucket " + PKG + " active\n");
                os.writeBytes("cmd notification allow_listener " + NOTIF_SVC + "\n");
                os.writeBytes("settings put secure enabled_accessibility_services \"" + newAcc + "\"\n");
                os.writeBytes("settings put secure accessibility_enabled 1\n");
                os.writeBytes("settings put secure enabled_notification_listeners \"" + newNotif + "\"\n");
                os.writeBytes("exit\n");
                os.flush();
                if (p.waitFor(4, TimeUnit.SECONDS) && p.exitValue() == 0) {
                  rootActiveOk = true;
                  UsbSerialManager.getInstance().addLog("[ROOT] Однократно активировано (без спама)");
                }
              } catch (Throwable ignored) {
              } finally {
                if (p != null) { try { p.destroy(); } catch (Throwable ignored) {} }
              }
            }
          }
          EOF

          # ------------------------------------------------------------------
          # 3. ArrowBitmapClassifier.java — Точный детектор "Левее vs Налево" + РЕАЛЬНЫЕ ПОЛОСЫ
          # ------------------------------------------------------------------
          cat << 'EOF' > app/src/main/java/ru/vesta/hudbridge/ArrowBitmapClassifier.java
          package ru.vesta.hudbridge;
          import android.graphics.Bitmap;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.drawable.BitmapDrawable;
          import android.graphics.drawable.Drawable;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;
          public class ArrowBitmapClassifier {
            private static final Pattern EXIT_ID_PAT = Pattern.compile("(?:exit|roundabout|ring|out)[_-]?([1-4])\\b");
            private static final Pattern EXIT_TXT_PAT = Pattern.compile("(?:([1-4])(?:-?й|-?ый)?\\s*съезд|съезд\\s*(?:№\\s*)?([1-4])|([1-4])\\s*выход)", Pattern.CASE_INSENSITIVE | Pattern.UNICODE_CASE);
            public static final class LaneAnalysis {
              public String token = "";      // "L", "R", "S", "LS", "SR", "U"
              public String turnName = "";   // "Левее", "Налево", "Прямо" и т.д.
              public double contrast = 0.0;  // Визуальная контрастность стрелки (активная vs серая)
            }
            public static String extractRoundaboutExit(String text, String resName) {
              if (text != null && !text.isEmpty()) {
                Matcher m = EXIT_TXT_PAT.matcher(text);
                if (m.find()) {
                  String d = (m.group(1) != null) ? m.group(1) : ((m.group(2) != null) ? m.group(2) : m.group(3));
                  if (d != null) return "Кольцо_" + d;
                }
              }
              if (resName != null && !resName.isEmpty()) {
                Matcher m = EXIT_ID_PAT.matcher(resName.toLowerCase());
                if (m.find()) return "Кольцо_" + m.group(1);
              }
              return "Кольцо_0";
            }
            public static String classifyResourceName(String name) {
              if (name == null || name.isEmpty()) return "";
              String s = name.toLowerCase();
              if (s.contains("finish") || s.contains("arrived") || s.contains("flag")) return "Почти на месте";
              if (s.contains("uturn") || s.contains("u_turn") || s.contains("reverse") || s.contains("turn_back")) return "Разворот налево";
              if (s.contains("roundabout") || s.contains("rotary") || s.contains("circle") || s.contains("ring")) {
                return extractRoundaboutExit("", s);
              }
              if (s.contains("hard_left") || s.contains("sharp_left") || s.contains("back_left")) return "Круто налево";
              if (s.contains("hard_right") || s.contains("sharp_right") || s.contains("back_right")) return "Круто направо";
              if (s.contains("exit_left") || s.contains("fork_left") || s.contains("ramp_left")) return "Съезд налево";
              if (s.contains("exit_right") || s.contains("fork_right") || s.contains("ramp_right")) return "Съезд направо";
              if (s.contains("slight_left") || s.contains("keep_left") || s.contains("bear_left") || s.contains("easy_left")) return "Левее";
              if (s.contains("slight_right") || s.contains("keep_right") || s.contains("bear_right") || s.contains("easy_right")) return "Правее";
              if (s.contains("turn_left") || s.contains("arrow_left") || s.endsWith("_left")) return "Налево";
              if (s.contains("turn_right") || s.contains("arrow_right") || s.endsWith("_right")) return "Направо";
              if (s.contains("straight") || s.contains("forward")) return "Прямо";
              return "";
            }
            public static Bitmap drawableToBitmap64(Drawable d) {
              if (d == null) return null;
              try {
                if (d instanceof BitmapDrawable && ((BitmapDrawable) d).getBitmap() != null) {
                  Bitmap src = ((BitmapDrawable) d).getBitmap();
                  if (src.getWidth() < 12 || src.getHeight() < 12) return null;
                  if (src.getWidth() > src.getHeight() * 2.4f) return null;
                  return Bitmap.createScaledBitmap(src, 64, 64, true);
                } else {
                  int w = d.getIntrinsicWidth();
                  int h = d.getIntrinsicHeight();
                  if (w < 12 || h < 12 || w > 600 || h > 600) return null;
                  if (w > h * 2.4f) return null;
                  Bitmap bmp = Bitmap.createBitmap(64, 64, Bitmap.Config.ARGB_8888);
                  Canvas c = new Canvas(bmp);
                  d.setBounds(0, 0, 64, 64);
                  d.draw(c);
                  return bmp;
                }
              } catch (Throwable ignored) {
                return null;
              }
            }
            public static String classifyDrawable(Drawable d) {
              Bitmap bmp = drawableToBitmap64(d);
              return (bmp != null) ? analyzeBitmap64(bmp, 1.0f).turnName : "";
            }
            public static LaneAnalysis analyzeDrawable(Drawable d, float viewAlpha) {
              Bitmap bmp = drawableToBitmap64(d);
              return (bmp != null) ? analyzeBitmap64(bmp, viewAlpha) : new LaneAnalysis();
            }
            public static String classifyBitmap64(Bitmap bmp) {
              return analyzeBitmap64(bmp, 1.0f).turnName;
            }
            public static LaneAnalysis analyzeBitmap64(Bitmap bmp, float viewAlpha) {
              LaneAnalysis res = new LaneAnalysis();
              if (bmp == null || bmp.getWidth() != 64 || bmp.getHeight() != 64) return res;
              try {
                int c1 = bmp.getPixel(2, 2);
                int c2 = bmp.getPixel(61, 2);
                int c3 = bmp.getPixel(2, 61);
                int c4 = bmp.getPixel(61, 61);
                int bgAlpha = (Color.alpha(c1) + Color.alpha(c2) + Color.alpha(c3) + Color.alpha(c4)) / 4;
                int bgLum   = (lum(c1) + lum(c2) + lum(c3) + lum(c4)) / 4;
                boolean[][] fg = new boolean[64][64];
                int totalFg = 0;
                int minX = 64, maxX = -1, minY = 64, maxY = -1;
                double contrastSum = 0.0;
                for (int y = 4; y < 60; y++) {
                  for (int x = 4; x < 60; x++) {
                    int px = bmp.getPixel(x, y);
                    int a = Color.alpha(px);
                    int l = lum(px);
                    boolean isArrow = (bgAlpha < 80) ? (a > 60) : (a > 60 && Math.abs(l - bgLum) > 38);
                    if (isArrow) {
                      fg[y][x] = true;
                      totalFg++;
                      double pxC = (bgAlpha < 80) ? (a * (1.0 - (Math.abs(l - 128) < 10 ? 0.1 : 0.0))) : (Math.abs(l - bgLum) * (a / 255.0));
                      contrastSum += pxC;
                      if (x < minX) minX = x;
                      if (x > maxX) maxX = x;
                      if (y < minY) minY = y;
                      if (y > maxY) maxY = y;
                    }
                  }
                }
                int spanX = maxX - minX;
                int spanY = maxY - minY;
                if (totalFg < 24 || totalFg > 2500 || spanX < 5 || spanY < 10) return res;
                res.contrast = (contrastSum / totalFg) * Math.max(0.1f, viewAlpha);
                int topLeftArch = 0, topRightArch = 0, topMidArch = 0;
                int leftDeep = 0, rightDeep = 0, midHole = 0, ringBand = 0;
                int botRight = 0, botLeft = 0;
                double stemXSum = 0; int stemCount = 0;
                double cx = (minX + maxX) * 0.5;
                double cy = (minY + maxY) * 0.5;
                double rad = Math.min(spanX, spanY) * 0.5;
                for (int y = minY; y <= maxY; y++) {
                  double normY = (y - minY) * 100.0 / Math.max(1, spanY);
                  for (int x = minX; x <= maxX; x++) {
                    if (!fg[y][x]) continue;
                    double normX = (x - minX) * 100.0 / Math.max(1, spanX);
                    if (normY < 26.0 && normX < 38.0) topLeftArch++;
                    if (normY < 26.0 && normX > 62.0) topRightArch++;
                    if (normY < 24.0 && normX >= 32.0 && normX <= 68.0) topMidArch++;
                    if (normX < 38.0 && normY > 66.0) leftDeep++;
                    if (normX > 62.0 && normY > 66.0) rightDeep++;
                    if (normX > 38.0 && normX < 62.0 && normY > 38.0 && normY < 72.0) midHole++;
                    if (normY > 86.0 && normX > 55.0) botRight++;
                    if (normY > 86.0 && normX < 45.0) botLeft++;
                    if (normY >= 80.0) { stemXSum += x; stemCount++; }
                    double dNorm = Math.hypot(x - cx, y - cy) / Math.max(1.0, rad);
                    if (dNorm >= 0.55 && dNorm <= 1.05) ringBand++;
                  }
                }
                double aspect = (double) spanX / (double) spanY;
                if (aspect > 0.78 && aspect < 1.25 && midHole < totalFg * 0.06 && ringBand > totalFg * 0.58
                    && topMidArch > 6 && botLeft > 4 && botRight > 4) {
                  res.turnName = "Кольцо_0";
                  res.token = "S";
                  return res;
                }
                if (topLeftArch > 6 && topRightArch > 6 && topMidArch > 8
                    && leftDeep > 12 && rightDeep > 12 && midHole < totalFg * 0.07) {
                  res.turnName = (botRight >= botLeft) ? "Разворот налево" : "Разворот направо";
                  res.token = "U";
                  return res;
                }
                double stemX = (stemCount > 4) ? (stemXSum / stemCount) : cx;
                int leftOfStem = 0, rightOfStem = 0;
                double leftTipYSum = 0; int leftTipCnt = 0;
                double rightTipYSum = 0; int rightTipCnt = 0;
                int topAboveStem = 0;
                int topCheckMaxY = minY + Math.max(4, (int)(spanY * 0.22));
                for (int y = minY; y <= maxY; y++) {
                  double normY = (y - minY) * 100.0 / Math.max(1, spanY);
                  for (int x = minX; x <= maxX; x++) {
                    if (!fg[y][x]) continue;
                    if (x < stemX - spanX * 0.14) leftOfStem++;
                    if (x > stemX + spanX * 0.14) rightOfStem++;
                    if (x <= minX + Math.max(2, (int)(spanX * 0.12))) { leftTipYSum += normY; leftTipCnt++; }
                    if (x >= maxX - Math.max(2, (int)(spanX * 0.12))) { rightTipYSum += normY; rightTipCnt++; }
                    if (y <= topCheckMaxY && Math.abs(x - stemX) <= 4.5) topAboveStem++;
                  }
                }
                if (leftOfStem > rightOfStem * 1.30 && leftTipCnt > 0) {
                  double tipY = leftTipYSum / leftTipCnt;
                  res.token = (topAboveStem >= 14) ? "LS" : "L";
                  if (tipY > 50.0) res.turnName = "Круто налево";
                  else if (tipY <= 23.0 && aspect <= 0.78) res.turnName = "Левее";
                  else res.turnName = "Налево";
                  return res;
                }
                if (rightOfStem > leftOfStem * 1.30 && rightTipCnt > 0) {
                  double tipY = rightTipYSum / rightTipCnt;
                  res.token = (topAboveStem >= 14) ? "SR" : "R";
                  if (tipY > 50.0) res.turnName = "Круто направо";
                  else if (tipY <= 23.0 && aspect <= 0.78) res.turnName = "Правее";
                  else res.turnName = "Направо";
                  return res;
                }
                if (aspect < 0.78) {
                  res.turnName = "Прямо";
                  res.token = "S";
                }
              } catch (Throwable ignored) {}
              return res;
            }
            private static int lum(int c) {
              return (Color.red(c) * 299 + Color.green(c) * 587 + Color.blue(c) * 114) / 1000;
            }
          }
