          # ------------------------------------------------------------------
          # 6. YandexAccessibilityService.java — Только верхняя карточка маневра + раздельные камеры
          # ------------------------------------------------------------------
          cat << 'EOF' > app/src/main/java/ru/vesta/hudbridge/YandexAccessibilityService.java
          package ru.vesta.hudbridge;
          import android.accessibilityservice.AccessibilityService;
          import android.graphics.Rect;
          import android.util.DisplayMetrics;
          import android.view.accessibility.AccessibilityEvent;
          import android.view.accessibility.AccessibilityNodeInfo;
          import android.view.accessibility.AccessibilityWindowInfo;
          import java.util.ArrayList;
          import java.util.List;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;
          public class YandexAccessibilityService extends AccessibilityService {
            private static volatile YandexAccessibilityService instance;
            private static volatile boolean alive = false;
            private static final Pattern DIST_PAT = Pattern.compile("^(\\d+(?:[.,]\\d+)?)\\s*(км|м|km|m)$", Pattern.CASE_INSENSITIVE | Pattern.UNICODE_CASE);
            private static final Pattern INLINE_DIST = Pattern.compile("(\\d+(?:[.,]\\d+)?)\\s*(км|м|km|m)(?![а-яА-ЯёЁa-zA-Z])", Pattern.CASE_INSENSITIVE | Pattern.UNICODE_CASE);
            private static final Pattern CAM_LIM_PAT = Pattern.compile("(?:камер|радар|огранич)[^\\d]{0,14}(20|30|40|50|60|70|80|90|100|110|120|130)(?!\\d)", Pattern.CASE_INSENSITIVE | Pattern.UNICODE_CASE);
            private volatile long lastScanMs = 0;
            private static final class NodeItem {
              String text;
              String idLow;
              Rect rect;
              NodeItem(String t, String id, Rect r) { text = t; idLow = id; rect = r; }
            }
            public static boolean isAlive() { return alive; }
            @Override
            protected void onServiceConnected() {
              super.onServiceConnected();
              instance = this;
              alive = true;
              RootAutoEnabler.ensureServicesActive(this, false);
            }
            @Override
            public void onDestroy() {
              alive = false;
              instance = null;
              super.onDestroy();
            }
            public static void pollScreenNow() {
              YandexAccessibilityService svc = instance;
              if (svc == null) return;
              long now = System.currentTimeMillis();
              if (now - svc.lastScanMs < 240) return;
              svc.scanNow();
            }
            @Override
            public void onAccessibilityEvent(AccessibilityEvent event) {
              long now = System.currentTimeMillis();
              if (now - lastScanMs < 140) return;
              scanNow();
            }
            private void scanNow() {
              lastScanMs = System.currentTimeMillis();
              int screenH = 720;
              try {
                DisplayMetrics dm = getResources().getDisplayMetrics();
                if (dm != null && dm.heightPixels > 200) screenH = dm.heightPixels;
              } catch (Throwable ignored) {}
              int maxManeuverY = (int) (screenH * 0.62f);
              List<NodeItem> items = new ArrayList<>();
              int[] speedLimHolder = new int[]{0};
              String[] turnHolder = new String[]{""};
              boolean yandexVisible = false;
              try {
                List<AccessibilityWindowInfo> windows = getWindows();
                if (windows != null && !windows.isEmpty()) {
                  for (AccessibilityWindowInfo win : windows) {
                    AccessibilityNodeInfo root = win.getRoot();
                    if (root != null) {
                      String pkg = (root.getPackageName() != null) ? root.getPackageName().toString().toLowerCase() : "";
                      if (pkg.contains("yandex") || pkg.contains("navi")) {
                        yandexVisible = true;
                        collectNodes(root, items, speedLimHolder, turnHolder, maxManeuverY, 0);
                      }
                      root.recycle();
                    }
                  }
                }
              } catch (Throwable ignored) {}
              if (!yandexVisible) {
                try {
                  AccessibilityNodeInfo root = getRootInActiveWindow();
                  if (root != null) {
                    String pkg = (root.getPackageName() != null) ? root.getPackageName().toString().toLowerCase() : "";
                    if (pkg.contains("yandex") || pkg.contains("navi")) {
                      yandexVisible = true;
                      collectNodes(root, items, speedLimHolder, turnHolder, maxManeuverY, 0);
                    }
                    root.recycle();
                  }
                } catch (Throwable ignored) {}
              }
              if (yandexVisible) UsbSerialManager.markYandexForeground();
              if (items.isEmpty()) return;
              for (NodeItem it : items) {
                String low = it.text.toLowerCase();
                if (low.contains("уведомлять") || low.contains("нештраф") || low.contains("звуки и оповещ")
                    || low.contains("настройки карты") || low.contains("превышение скорости")) {
                  return;
                }
              }
              String bestDist = "";
              String bestStreet = "";
              int bestDistTop = Integer.MAX_VALUE;
              Rect bestDistRect = null;
              String detectedTurn = turnHolder[0];
              int camDistM = 0;
              int camLim = 0;
              for (int i = 0; i < items.size(); i++) {
                NodeItem it = items.get(i);
                String s = it.text;
                String low = s.toLowerCase();
                if (low.contains("мин") || low.matches(".*\\b\\d{1,2}:\\d{2}\\b.*")) continue;
                if (UsbSerialManager.isCameraText(low)) {
                  Matcher mC = INLINE_DIST.matcher(s);
                  if (mC.find()) camDistM = UsbSerialManager.parseMetersFromDistStr(mC.group(1) + " " + mC.group(2));
                  Matcher mL = CAM_LIM_PAT.matcher(s);
                  if (mL.find()) { try { camLim = Integer.parseInt(mL.group(1)); } catch (Throwable ignored) {} }
                  continue;
                }
                if (it.rect.top > maxManeuverY) continue;
                String tWord = YandexNotificationService.extractTurnWordFromText(s);
                if (!tWord.isEmpty() && detectedTurn.isEmpty()) detectedTurn = tWord;
                String foundD = "";
                String inlineTail = "";
                Matcher mExact = DIST_PAT.matcher(s);
                if (mExact.matches()) {
                  foundD = mExact.group(1).replace(',', '.') + " " + mExact.group(2).toLowerCase();
                } else {
                  Matcher mIn = INLINE_DIST.matcher(s);
                  if (mIn.find()) {
                    foundD = mIn.group(1).replace(',', '.') + " " + mIn.group(2).toLowerCase();
                    inlineTail = s.substring(mIn.end()).trim();
                  }
                }
                if (!foundD.isEmpty() && it.rect.top < bestDistTop) {
                  bestDistTop = it.rect.top;
                  bestDist = foundD;
                  bestDistRect = it.rect;
                  bestStreet = (inlineTail.length() >= 2 && !UsbSerialManager.isCameraText(inlineTail.toLowerCase())) ? inlineTail : "";
                }
              }
              if (!bestDist.isEmpty() && bestStreet.isEmpty() && bestDistRect != null) {
                for (NodeItem it : items) {
                  if (it.rect.top > maxManeuverY) continue;
                  String s = it.text;
                  String low = s.toLowerCase();
                  if (s.length() < 3 || DIST_PAT.matcher(s).matches() || s.matches("^\\d+$")) continue;
                  if (low.contains("мин") || low.matches(".*\\b\\d{1,2}:\\d{2}\\b.*") || UsbSerialManager.isCameraText(low)) continue;
                  if (Math.abs(it.rect.top - bestDistRect.top) < 160 && Math.abs(it.rect.left - bestDistRect.left) < 340) {
                    if (!s.equalsIgnoreCase(bestDist)) { bestStreet = s; break; }
                  }
                }
              }
              if (speedLimHolder[0] > 0) UsbSerialManager.getInstance().updateSpeedLimit(this, speedLimHolder[0], "SIGN");
              if (camDistM > 0 || camLim > 0) UsbSerialManager.getInstance().sendCameraAlert(this, camDistM, camLim > 0 ? camLim : speedLimHolder[0], "CAM");
              if (!bestDist.isEmpty()) {
                int distM = UsbSerialManager.parseMetersFromDistStr(bestDist);
                UsbSerialManager.markRouteSeen(distM);
                if (detectedTurn.isEmpty()) detectedTurn = UsbSerialManager.getRecentNotifTurn();
                if (!detectedTurn.isEmpty()) UsbSerialManager.rememberTurn(detectedTurn);
                else detectedTurn = UsbSerialManager.getRememberedTurn();
                StringBuilder sb = new StringBuilder(bestDist);
                if (!detectedTurn.isEmpty()) sb.append(" ").append(detectedTurn);
                if (!bestStreet.isEmpty() && !bestStreet.equalsIgnoreCase(detectedTurn)) sb.append(" ").append(bestStreet);
                UsbSerialManager.getInstance().sendYandexPayload(this, sb.toString(), "SCREEN");
              }
            }
            private void collectNodes(AccessibilityNodeInfo node, List<NodeItem> out, int[] speedLimHolder, String[] turnHolder, int maxManeuverY, int depth) {
              if (node == null || depth > 16 || out.size() > 140) return;
              Rect r = new Rect();
              try { node.getBoundsInScreen(r); } catch (Throwable ignored) {}
              String idLow = (node.getViewIdResourceName() != null) ? node.getViewIdResourceName().toLowerCase() : "";
              String cdRaw = (node.getContentDescription() != null) ? node.getContentDescription().toString().trim() : "";
              String txtRaw = (node.getText() != null) ? node.getText().toString().trim() : "";
              if (r.top <= maxManeuverY && turnHolder[0].isEmpty() && !idLow.isEmpty()) {
                String t = ArrowBitmapClassifier.classifyResourceName(idLow);
                if (!t.isEmpty()) turnHolder[0] = t;
              }
              boolean isSpeedLimitNode = idLow.contains("limit") || cdRaw.toLowerCase().contains("огранич");
              boolean isSpeedometerNode = idLow.contains("speedometer") || idLow.contains("current_speed");
              if (isSpeedLimitNode && !isSpeedometerNode && speedLimHolder[0] == 0) {
                String cand = txtRaw.matches("^(20|30|40|50|60|70|80|90|100|110|120|130)$") ? txtRaw : "";
                if (!cand.isEmpty()) speedLimHolder[0] = Integer.parseInt(cand);
              }
              if (!cdRaw.isEmpty()) {
                out.add(new NodeItem(cdRaw, idLow, r));
                if (r.top <= maxManeuverY && turnHolder[0].isEmpty()) {
                  String t = YandexNotificationService.extractTurnWordFromText(cdRaw);
                  if (t.isEmpty()) t = ArrowBitmapClassifier.classifyResourceName(cdRaw);
                  if (!t.isEmpty()) turnHolder[0] = t;
                }
              }
              if (!txtRaw.isEmpty() && !isSpeedometerNode) out.add(new NodeItem(txtRaw, idLow, r));
              for (int i = 0; i < node.getChildCount(); i++) {
                AccessibilityNodeInfo ch = node.getChild(i);
                if (ch != null) {
                  collectNodes(ch, out, speedLimHolder, turnHolder, maxManeuverY, depth + 1);
                  ch.recycle();
                }
              }
            }
            @Override
            public void onInterrupt() {}
          }
