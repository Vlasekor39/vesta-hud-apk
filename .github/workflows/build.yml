name: Build VestaHudBridge v4.0 APK

on:
  push:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: 4. Generate Android Project Files (VestaHudBridge v4.0)
        run: |
          mkdir -p app/src/main/java/ru/vesta/hudbridge
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values

          cat << 'EOF' > settings.gradle
          rootProject.name = "VestaHudBridge"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.4'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'ru.vesta.hudbridge'
              compileSdk 34

              defaultConfig {
                  applicationId "ru.vesta.hudbridge"
                  minSdk 24
                  targetSdk 33
                  versionCode 40
                  versionName "4.0-ROOT-BITMAP"
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
          }
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Vesta HUD Bridge v4.0</string>
              <string name="acc_desc">Перехват стрелок и маневров Яндекс.Навигатора (включая свернутый режим) для Lada Vesta HUD</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/xml/accessibility_service_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowContentChanged|typeWindowStateChanged|typeNotificationStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault|flagRetrieveInteractiveWindows|flagReportViewIds|flagIncludeNotImportantViews"
              android:canRetrieveWindowContent="true"
              android:description="@string/acc_desc"
              android:notificationTimeout="80" />
          EOF

          cat << 'EOF' > app/src/main/res/xml/usb_device_filter.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <!-- ESP32-S3 Native USB / JTAG / CDC (Espressif) -->
              <usb-device vendor-id="12346" />
              <!-- CH340 / CH341 -->
              <usb-device vendor-id="6790" />
              <!-- CP210x (Silicon Labs) -->
              <usb-device vendor-id="4292" />
              <!-- FT232 (FTDI) -->
              <usb-device vendor-id="1027" />
          </resources>
          EOF

