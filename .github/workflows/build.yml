                  String info = "Статус служб на Teyes CC3:\n"
                      + "• Чтение экрана (Accessibility): " + (accOk ? "✅ ВКЛЮЧЕНА" : "❌ ВЫКЛ (нажми кнопку 1)") + "\n"
                      + "• Перехват шторки (Notifications): " + (notOk ? "✅ ВКЛЮЧЕНА" : "❌ ВЫКЛ (нажми кнопку 1)") + "\n"
                      + "• Анти-выгрузка (KeepAlive 300мс + WakeLock): " + (HudKeepAliveService.isRunning() ? "✅ РАБОТАЕТ" : "⏳ ЗАПУСК") + "\n"
                      + "• Реальные полосы Яндекса: " + (lanes.isEmpty() ? "нет" : lanes) + "\n"
                      + "• Знак скорости в памяти: " + (lim > 0 ? (lim + " км/ч") : "нет") + "\n"
                      + "• USB ESP32-S3: " + UsbSerialManager.getInstance().getLastStatus();
                  statusView.setText(info);
                  logView.setText(UsbSerialManager.getInstance().getDebugLog());
                } catch (Throwable ignored) {}
                handler.postDelayed(this, 600);
              }
            };
            @Override
            protected void onDestroy() {
              super.onDestroy();
              handler.removeCallbacksAndMessages(null);
            }
          }
          EOF

      - name: 5. Accept Android SDK Licenses & Build APK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/sdkmanager --licenses || true
          gradle assembleDebug --no-daemon

      - name: 6. Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk VestaHudBridge-v4.4.apk

      - name: 7. Upload Ready APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VestaHudBridge-v4.4-APK
          path: VestaHudBridge-v4.4.apk
