          package ru.vesta.hudbridge;
          import android.accessibilityservice.AccessibilityService;
          import android.view.accessibility.AccessibilityEvent;
          import android.view.accessibility.AccessibilityNodeInfo;
          import android.view.accessibility.AccessibilityWindowInfo;
          import java.util.ArrayList;
          import java.util.List;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;
          public class YandexAccessibilityService extends AccessibilityService {
            private static volatile YandexAccessibilityService instance;
            private static volatile boolean alive = false;
            private static final Pattern DIST_PAT = Pattern.compile("^(\\d+(?:[.,]\\d+)?)\\s*(км|м|km|m)$", Pattern.CASE_INSENSITIVE | Pattern.UNICODE_CASE);
            private static final Pattern INLINE_DIST = Pattern.compile("(\\d+(?:[.,]\\d+)?)\\s*(км|м|km|m)(?![а-яА-ЯёЁa-zA-Z])", Pattern.CASE_INSENSITIVE | Pattern.UNICODE_CASE);
            private volatile long lastScanMs = 0;
            public static boolean isAlive() {
              return alive;
            }
            @Override
            protected void onServiceConnected() {
              super.onServiceConnected();
              instance = this;
              alive = true;
              RootAutoEnabler.ensureServicesActive(this, false);
            }
            @Override
            public void onDestroy() {
              alive = false;
              instance = null;
              super.onDestroy();
            }
            public static void pollScreenNow() {
              YandexAccessibilityService svc = instance;
              if (svc == null) return;
              long now = System.currentTimeMillis();
              if (now - svc.lastScanMs < 240) return;
              svc.scanNow();
            }
            @Override
            public void onAccessibilityEvent(AccessibilityEvent event) {
              long now = System.currentTimeMillis();
              if (now - lastScanMs < 140) return;
              scanNow();
            }
            private void scanNow() {
              lastScanMs = System.currentTimeMillis();
              RootAutoEnabler.ensureServicesActive(this, false);
              List<String> nodes = new ArrayList<>();
              int[] speedLimHolder = new int[]{0};
              String detectedTurn = "";
              boolean yandexVisible = false;
              try {
                List<AccessibilityWindowInfo> windows = getWindows();
                if (windows != null && !windows.isEmpty()) {
                  for (AccessibilityWindowInfo win : windows) {
                    AccessibilityNodeInfo root = win.getRoot();
                    if (root != null) {
                      String pkg = (root.getPackageName() != null) ? root.getPackageName().toString().toLowerCase() : "";
                      if (pkg.contains("yandex") || pkg.contains("navi")) {
                        yandexVisible = true;
                        String turn = collectNodes(root, nodes, speedLimHolder);
                        if (detectedTurn.isEmpty() && !turn.isEmpty()) detectedTurn = turn;
                      }
                      root.recycle();
                    }
                  }
                }
              } catch (Throwable ignored) {}
              if (!yandexVisible) {
                try {
                  AccessibilityNodeInfo root = getRootInActiveWindow();
                  if (root != null) {
                    String pkg = (root.getPackageName() != null) ? root.getPackageName().toString().toLowerCase() : "";
                    if (pkg.contains("yandex") || pkg.contains("navi")) {
                      yandexVisible = true;
                      String turn = collectNodes(root, nodes, speedLimHolder);
                      if (detectedTurn.isEmpty() && !turn.isEmpty()) detectedTurn = turn;
                    }
                    root.recycle();
                  }
                } catch (Throwable ignored) {}
              }
              if (yandexVisible) {
                UsbSerialManager.markYandexForeground();
              }
              if (nodes.isEmpty()) return;
              for (String s : nodes) {
                String low = s.toLowerCase();
                if (low.contains("уведомлять") || low.contains("нештраф") || low.contains("звуки и оповещ")
                    || low.contains("настройки карты") || low.contains("превышение скорости")) {
                  return;
                }
              }
              String distStr = "";
              String streetStr = "";
              for (int i = 0; i < nodes.size(); i++) {
                String s = nodes.get(i).trim();
                if (s.isEmpty()) continue;
                String low = s.toLowerCase();
                if (low.contains("мин") || low.matches(".*\\b\\d{1,2}:\\d{2}\\b.*")) continue;
                String tWord = YandexNotificationService.extractTurnWordFromText(s);
                if (!tWord.isEmpty() && detectedTurn.isEmpty()) {
                  detectedTurn = tWord;
                }
                Matcher mExact = DIST_PAT.matcher(s);
                if (mExact.matches() && distStr.isEmpty()) {
                  distStr = mExact.group(1).replace(',', '.') + " " + mExact.group(2).toLowerCase();
                  if (i + 1 < nodes.size()) {
                    String next = nodes.get(i + 1).trim();
                    if (next.length() >= 2 && !next.toLowerCase().contains("мин") && !next.matches(".*\\b\\d{1,2}:\\d{2}\\b.*")) {
                      streetStr = next;
                    }
                  }
                  continue;
                }
                Matcher mIn = INLINE_DIST.matcher(s);
                if (mIn.find() && distStr.isEmpty()) {
                  distStr = mIn.group(1).replace(',', '.') + " " + mIn.group(2).toLowerCase();
                  String tail = s.substring(mIn.end()).trim();
                  if (tail.length() >= 2 && streetStr.isEmpty()) {
                    streetStr = tail;
                  }
                }
              }
              if (!distStr.isEmpty()) {
                int distM = UsbSerialManager.parseMetersFromDistStr(distStr);
                UsbSerialManager.markRouteSeen(distM);
                if (!detectedTurn.isEmpty()) {
                  UsbSerialManager.rememberTurn(detectedTurn);
                } else {
                  detectedTurn = UsbSerialManager.getRememberedTurn();
                }
                StringBuilder sb = new StringBuilder(distStr);
                if (!detectedTurn.isEmpty()) sb.append(" ").append(detectedTurn);
                if (!streetStr.isEmpty() && !streetStr.equalsIgnoreCase(detectedTurn)) {
                  sb.append(" ").append(streetStr);
                }
                UsbSerialManager.getInstance().sendYandexPayload(this, sb.toString(), "SCREEN");
              }
              if (speedLimHolder[0] > 0) {
                UsbSerialManager.getInstance().sendYandexPayload(this, "0 Ограничение " + speedLimHolder[0], "SIGN");
              }
            }
            private String collectNodes(AccessibilityNodeInfo node, List<String> out, int[] speedLimHolder) {
              if (node == null) return "";
              String foundTurn = "";
              String idLow = (node.getViewIdResourceName() != null) ? node.getViewIdResourceName().toLowerCase() : "";
              String cdRaw = (node.getContentDescription() != null) ? node.getContentDescription().toString().trim() : "";
              String txtRaw = (node.getText() != null) ? node.getText().toString().trim() : "";
              if (!idLow.isEmpty()) {
                String t = ArrowBitmapClassifier.classifyResourceName(idLow);
                if (!t.isEmpty()) foundTurn = t;
              }
              boolean isSpeedLimitNode = idLow.contains("limit") || cdRaw.toLowerCase().contains("огранич");
              boolean isSpeedometerNode = idLow.contains("speedometer") || idLow.contains("current_speed");
              if (isSpeedLimitNode && !isSpeedometerNode && speedLimHolder[0] == 0) {
                String candidate = txtRaw.matches("^(20|30|40|50|60|70|80|90|100|110|120|130)$") ? txtRaw : "";
                if (!candidate.isEmpty()) {
                  speedLimHolder[0] = Integer.parseInt(candidate);
                }
              }
              if (!cdRaw.isEmpty()) {
                out.add(cdRaw);
                String t = YandexNotificationService.extractTurnWordFromText(cdRaw);
                if (t.isEmpty()) t = ArrowBitmapClassifier.classifyResourceName(cdRaw);
                if (!t.isEmpty() && foundTurn.isEmpty()) foundTurn = t;
              }
              if (!txtRaw.isEmpty() && !isSpeedometerNode) {
                out.add(txtRaw);
              }
              for (int i = 0; i < node.getChildCount(); i++) {
                AccessibilityNodeInfo ch = node.getChild(i);
                if (ch != null) {
                  String childTurn = collectNodes(ch, out, speedLimHolder);
                  if (foundTurn.isEmpty() && !childTurn.isEmpty()) foundTurn = childTurn;
                  ch.recycle();
                }
              }
              return foundTurn;
            }
            @Override
            public void onInterrupt() {}
          }
          EOF

